name: Auto Update Surge Modules

on:
  schedule:
    # 每天北京时间 04:00 (UTC 20:00) 自动执行一次
    - cron: "0 20 * * *"
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync and convert upstream Loon plugins
        run: node update.mjs --force

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Surge/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动更新插件模块 ($(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M'))"
            git push
            echo "✅ 检测到上游规则更新，已自动提交并推送！"
          else
            echo "ℹ️ 当前所有模块均已是最新，无需提交。"
          fi
