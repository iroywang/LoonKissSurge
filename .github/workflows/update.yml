name: Auto Update Surge Modules

on:
  schedule:
    # 每天北京时间 09:00 (UTC 01:00) 自动执行一次
    - cron: "0 1 * * *"
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击按钮触发
  push:
    paths:
      - ".github/workflows/update.yml"
      - "update.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Cloudflare WARP Proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new || warp-cli --accept-tos register
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in {1..15}; do
            if curl -s -x socks5h://127.0.0.1:40000 --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "✅ Cloudflare WARP connected!"
              break
            fi
            sleep 2
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync and convert upstream Loon plugins
        env:
          WARP_PROXY: socks5h://127.0.0.1:40000
        run: node update.mjs

      - name: Commit and push if changed
        id: commit_step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Surge/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动更新插件模块 ($(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M'))"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到上游规则更新，已自动提交并推送！"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 当前所有模块均已是最新，无需提交。"
          fi

      - name: Send WeChat notification if changed
        if: steps.commit_step.outputs.has_changes == 'true'
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: node notify.mjs
